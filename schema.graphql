type Bookmark {
  savedAt: DateTime!
  tweet: Tweet!
}

type Conversation {
  id: ID!
  lastMessage: Message
  messages(after: String, before: String, first: Int, last: Int): ConversationMessagesConnection!
  otherParticipant: User!
  unreadCount: Int!
  updatedAt: DateTime!
}

type ConversationMessagesConnection {
  edges: [ConversationMessagesConnectionEdge!]!
  pageInfo: PageInfo!
}

type ConversationMessagesConnectionEdge {
  cursor: String!
  node: Message!
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

type Follow {
  createdAt: DateTime!
  follower: User!
  following: User!
}

type Like {
  likedAt: DateTime!
  tweet: Tweet!
}

type Message {
  content: String!
  conversationId: ID!
  createdAt: DateTime!
  id: ID!
  mediaPaths: [String!]!
  sender: User!
  senderId: ID!
}

type Mutation {
  block(userId: ID!): User!
  bookmarkTweet(id: ID!): Tweet!
  createThread(parts: [ThreadPartInput!]!): Tweet!
  createTweet(content: String!, location: String, mediaUrls: [String!], parentId: ID, poll: PollInput, quotedId: ID): Tweet!
  deleteTweet(id: ID!): Boolean!
  follow(userId: ID!): User!
  likeTweet(id: ID!): Tweet!
  markConversationRead(conversationId: ID!): Conversation!
  markNotificationsRead: Int!
  mute(userId: ID!): User!
  pinTweet(id: ID!): [Tweet!]!
  retweet(id: ID!): Tweet!
  sendMessage(content: String!, conversationId: ID!, mediaPaths: [String!]): Message!
  startConversation(userId: ID!): Conversation!
  unblock(userId: ID!): User!
  unbookmarkTweet(id: ID!): Tweet!
  unfollow(userId: ID!): User!
  unlikeTweet(id: ID!): Tweet!
  unmute(userId: ID!): User!
  unpinTweet(id: ID!): [Tweet!]!
  unretweet(id: ID!): Tweet!
  updateProfile(input: UpdateProfileInput!): User!
  votePoll(optionId: ID!): Poll!
}

type Notification {
  actor: User!
  createdAt: DateTime!
  id: ID!
  isUnread: Boolean!
  tweet: Tweet
  type: NotificationType!
}

enum NotificationType {
  FOLLOW
  LIKE
  MENTION
  QUOTE
  REPLY
  REPOST
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Poll {
  endsAt: DateTime!
  id: ID!
  isClosed: Boolean!
  options: [PollOption!]!
  totalVotes: Int!
  viewerIsAuthor: Boolean!
  viewerVoteOptionId: ID
}

input PollInput {
  durationMinutes: Int!
  options: [String!]!
}

type PollOption {
  id: ID!
  text: String!
  voteCount: Int!
}

type Query {
  blockedAccounts: [User!]!
  bookmarks(after: String, before: String, first: Int, last: Int): QueryBookmarksConnection!
  conversation(id: ID!): Conversation
  conversations: [Conversation!]!
  exploreFeed(after: String, before: String, first: Int, last: Int): QueryExploreFeedConnection!
  hashtagTweets(after: String, before: String, first: Int, last: Int, tag: String!): QueryHashtagTweetsConnection!
  homeFeed(after: String, before: String, first: Int, last: Int): QueryHomeFeedConnection!
  likedTweets(after: String, before: String, first: Int, last: Int): QueryLikedTweetsConnection!
  me: User
  mutedAccounts: [User!]!
  notifications(after: String, before: String, first: Int, last: Int): QueryNotificationsConnection!
  popularTweets(after: String, before: String, first: Int, last: Int): QueryPopularTweetsConnection!
  searchTweets(after: String, before: String, first: Int, last: Int, query: String!): QuerySearchTweetsConnection!
  searchUsers(query: String!): [User!]!
  trendingHashtags(first: Int = 10): [Trend!]!
  tweet(id: ID!): Tweet
  unreadMessageCount: Int!
  unreadNotificationCount: Int!
  user(username: String!): User
  usernameAvailable(username: String!): UsernameCheck!
  whoToFollow(first: Int = 3): [User!]!
}

type QueryBookmarksConnection {
  edges: [QueryBookmarksConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryBookmarksConnectionEdge {
  cursor: String!
  node: Bookmark!
}

type QueryExploreFeedConnection {
  edges: [QueryExploreFeedConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryExploreFeedConnectionEdge {
  cursor: String!
  node: Tweet!
}

type QueryHashtagTweetsConnection {
  edges: [QueryHashtagTweetsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryHashtagTweetsConnectionEdge {
  cursor: String!
  node: Tweet!
}

type QueryHomeFeedConnection {
  edges: [QueryHomeFeedConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryHomeFeedConnectionEdge {
  cursor: String!
  node: Tweet!

  """Set when this entry is here because someone reposted it."""
  repostedBy: Reposter
}

type QueryLikedTweetsConnection {
  edges: [QueryLikedTweetsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryLikedTweetsConnectionEdge {
  cursor: String!
  node: Like!
}

type QueryNotificationsConnection {
  edges: [QueryNotificationsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryNotificationsConnectionEdge {
  cursor: String!
  node: Notification!
}

type QueryPopularTweetsConnection {
  edges: [QueryPopularTweetsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryPopularTweetsConnectionEdge {
  cursor: String!
  node: Tweet!
}

type QuerySearchTweetsConnection {
  edges: [QuerySearchTweetsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QuerySearchTweetsConnectionEdge {
  cursor: String!
  node: Tweet!
}

"""Who reposted a chirp into your feed."""
type Reposter {
  displayName: String!
  id: ID!
  username: String!
}

input ThreadPartInput {
  content: String!
  location: String
  mediaUrls: [String!]
  poll: PollInput
}

"""A #tag and how many chirps used it recently."""
type Trend {
  chirpCount: Int!
  tag: String!
}

type Tweet {
  ancestors: [Tweet!]!
  author: User!
  content: String!
  createdAt: DateTime!
  hasThread: Boolean!
  id: ID!
  isPinned: Boolean!
  isQuote: Boolean!
  likeCount: Int!
  location: String
  mediaUrls: [String!]!
  parent: Tweet
  poll: Poll
  quoteCount: Int!
  quoted: Tweet
  replies(after: String, before: String, first: Int, last: Int): TweetRepliesConnection!
  replyCount: Int!
  retweetCount: Int!
  threadContinuation: [Tweet!]!
  viewerHasBookmarked: Boolean!
  viewerHasLiked: Boolean!
  viewerHasRetweeted: Boolean!
}

type TweetRepliesConnection {
  edges: [TweetRepliesConnectionEdge!]!
  pageInfo: PageInfo!
}

type TweetRepliesConnectionEdge {
  cursor: String!
  node: Tweet!
}

input UpdateProfileInput {
  avatarUrl: String
  bannerUrl: String
  bio: String
  displayName: String!
  username: String
}

type User {
  avatarUrl: String
  bannerUrl: String
  bio: String
  blocksViewer: Boolean!
  createdAt: DateTime!
  displayName: String!
  followerCount: Int!
  followers(after: String, before: String, first: Int, last: Int): UserFollowersConnection!
  following(after: String, before: String, first: Int, last: Int): UserFollowingConnection!
  followingCount: Int!
  followsViewer: Boolean!
  id: ID!
  media(after: String, before: String, first: Int, last: Int): UserMediaConnection!
  replies(after: String, before: String, first: Int, last: Int): UserRepliesConnection!
  timeline(after: String, before: String, first: Int, last: Int): UserTimelineConnection!
  tweetCount: Int!
  tweets(after: String, before: String, first: Int, last: Int): UserTweetsConnection!
  username: String!
  viewerHasBlocked: Boolean!
  viewerHasMuted: Boolean!
  viewerIsFollowing: Boolean!
}

type UserFollowersConnection {
  edges: [UserFollowersConnectionEdge!]!
  pageInfo: PageInfo!
}

type UserFollowersConnectionEdge {
  cursor: String!
  node: Follow!
}

type UserFollowingConnection {
  edges: [UserFollowingConnectionEdge!]!
  pageInfo: PageInfo!
}

type UserFollowingConnectionEdge {
  cursor: String!
  node: Follow!
}

type UserMediaConnection {
  edges: [UserMediaConnectionEdge!]!
  pageInfo: PageInfo!
}

type UserMediaConnectionEdge {
  cursor: String!
  node: Tweet!
}

type UserRepliesConnection {
  edges: [UserRepliesConnectionEdge!]!
  pageInfo: PageInfo!
}

type UserRepliesConnectionEdge {
  cursor: String!
  node: Tweet!
}

type UserTimelineConnection {
  edges: [UserTimelineEdge!]!
  pageInfo: PageInfo!
}

type UserTimelineEdge {
  cursor: String!
  node: Tweet!

  """The pinned chirp, shown first on the first page."""
  pinned: Boolean!

  """Set when this entry is a repost: when it was reposted."""
  repostedAt: DateTime
}

type UserTweetsConnection {
  edges: [UserTweetsConnectionEdge!]!
  pageInfo: PageInfo!
}

type UserTweetsConnectionEdge {
  cursor: String!
  node: Tweet!
}

type UsernameCheck {
  available: Boolean!
  message: String
}
